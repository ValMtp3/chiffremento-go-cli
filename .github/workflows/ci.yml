name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # macOS et Windows ne sont pas du luxe : la distribution Homebrew est un
    # cask, donc macOS est la cible principale. Un test piloté par pseudo-
    # terminal a déjà bloqué dix minutes sur macOS en restant vert sur Linux,
    # parce que le tampon d'un pty fermé y survit et pas ailleurs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vérifier le formatage
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Ces fichiers ne sont pas formatés :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race pour attraper toute course entre la goroutine de chiffrement et
      # l'animation de progression.
      #
      # -timeout au-delà du défaut de dix minutes : cette suite lance
      # délibérément des dérivations Argon2 de 256 Mio à 1 Gio, et
      # l'instrumentation du détecteur de courses les alourdit encore. Le runner
      # macOS dépassait la limite par simple accumulation, sans qu'aucun test ne
      # soit bloqué. Un vrai blocage se voit toujours : le test fautif est nommé
      # dans la trace.
      - name: Tests
        run: go test -race -timeout 25m ./...

      # Les deux fonctions qui lisent des octets venus de l'extérieur. Une
      # courte passe à chaque CI : le corpus s'accumule dans le cache du
      # runner, et une régression de validation se voit tout de suite.
      # -parallel borne les workers : à 10, l'arrêt du fuzzer part parfois en
      # « context deadline exceeded » sans qu'aucun cas ne soit trouvé.
      # Sur un seul système : le fuzzing cherche des bugs de validation, pas des
      # différences de plateforme, et le corpus se partage mal entre runners.
      - name: Fuzzing de l'en-tête
        if: matrix.os == 'ubuntu-latest'
        run: go test ./pkg -run '^$' -fuzz FuzzReadHeader -fuzztime 30s -parallel 4

      - name: Fuzzing des chemins d'archive
        if: matrix.os == 'ubuntu-latest'
        run: go test ./pkg -run '^$' -fuzz FuzzSafeArchivePath -fuzztime 30s -parallel 4

      # Une seule itération : on ne mesure pas une performance fiable sur un
      # runner partagé, on vérifie que les benchmarks compilent et tournent.
      - name: Benchmarks (fumée)
        if: matrix.os == 'ubuntu-latest'
        run: go test ./pkg -run '^$' -bench . -benchtime 1x
