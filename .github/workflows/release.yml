name: goreleaser

on:
  push:
    tags:
      - 'v*'
  # Permet de relancer une release à la main depuis un tag existant, sans
  # avoir à supprimer puis repousser le tag.
  workflow_dispatch:

permissions:
  contents: write

# Les actions sont épinglées par SHA de commit, pas par tag : un tag se déplace,
# un SHA non. Ce job détient un jeton qui écrit dans le tap Homebrew — une
# action compromise derrière un tag déplacé pousserait un cask piégé à tous
# les utilisateurs de brew. Dependabot propose les mises à jour
# (.github/dependabot.yml).
jobs:
  goreleaser:
    # workflow_dispatch se lance depuis n'importe quelle ref : seule une ref de
    # tag de version peut publier.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Figé sur la v2 majeure : une v3 pourrait changer le format de
          # .goreleaser.yaml sans prévenir au milieu d'une release.
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
