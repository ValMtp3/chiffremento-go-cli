name: mutation

# Une fois par semaine, pas à chaque PR : la suite de pkg prend ~40 s (Argon2
# à 256 Mio–1 Gio), et gremlins la relance une fois par mutant.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation (${{ matrix.nom }})
    runs-on: ubuntu-latest
    # Mesuré en local (10 cœurs) : 29 min pour « coeur », 11 min pour
    # « crypto ». Un runner à 4 cœurs est environ deux fois plus lent ; 120 min
    # laissent de la marge à chaque job.
    timeout-minutes: 120
    # Deux périmètres indépendants : un seuil raté sur l'un ne doit pas cacher
    # le résultat de l'autre.
    strategy:
      fail-fast: false
      matrix:
        include:
          # format, clés, remplissage (pad), métadonnées : une comparaison
          # fausse y casse le format ou la sécurité.
          # Seuils : efficacité mesurée 90,14 % et couverture des mutants
          # 81,14 % sur macOS 10 cœurs. Efficacité : marge de 5 points pour la
          # variance des timeouts sur ubuntu 4 cœurs. Couverture : mesure moins
          # 1 point, pour que les mutants non couverts ne grossissent pas en
          # silence. À relever après 2 ou 3 vraies exécutions.
          - nom: coeur
            exclure: '(crypto|archive|passwd|passphrase|benchmark|durabilite)[a-z_]*\.go$'
            efficacite: 85
            couverture: 80
          # crypto.go seul : le flux chiffré lui-même.
          # Mesuré : efficacité 88,35 %, couverture 99,04 %.
          - nom: crypto
            exclure: '(format|keys|pad|metadata|kdf|atomicwriter|archive|passwd|passphrase|benchmark|durabilite)[a-z_]*\.go$'
            efficacite: 83
            couverture: 98
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # gremlins est un outil, pas une dépendance : `go install` avec une
      # version exacte ne touche ni go.mod ni go.sum.
      - name: Installer gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      # Les fichiers hors périmètre sont exclus avec -E (gremlins n'a pas
      # d'option « inclure »). Les autres paquets ne sont pas touchés.
      #
      # -count=1 : gremlins fixe le délai de chaque mutant d'après la durée de
      # sa première passe de tests. Avec le cache de go test, cette passe dure
      # 0,1 s et tous les mutants partent en « timed out ».
      # --timeout-coefficient 6 : la suite fait du Argon2 en parallèle, sa durée
      # varie. --workers 2 : chaque test peut prendre jusqu'à 1 Gio.
      #
      # timeout-minutes: 90 sur l'étape elle-même, le job gardant ses 120 min :
      # si gremlins reste bloqué, l'étape suivante a le temps de nettoyer.
      # gremlins passe -timeout à go test, mais à l'échéance seul le processus
      # `go` est tué : un mutant qui boucle à l'infini peut laisser le binaire
      # de test vivant, et gremlins attend alors indéfiniment.
      - name: Tests de mutation
        timeout-minutes: 90
        env:
          GOFLAGS: -count=1
        run: >
          gremlins unleash ./pkg
          --workers 2
          --timeout-coefficient 6
          -E '${{ matrix.exclure }}'
          --threshold-efficacy ${{ matrix.efficacite }}
          --threshold-mcover ${{ matrix.couverture }}

      # Même si l'étape précédente a échoué ou expiré : on tue les binaires de
      # test restés vivants (voir le commentaire ci-dessus), pour qu'ils ne
      # tournent pas à 100 % de CPU jusqu'à la fin du job.
      - name: Tuer les tests orphelins
        if: always()
        run: pkill -f 'pkg\.test' || true
