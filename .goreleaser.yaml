version: 2

project_name: chiffremento

before:
  hooks:
    - go mod tidy

# Pas de `header` figé ici : celui de la v1.1.0 était réaffiché tel quel sur
# chaque nouvelle release. Le changelog ci-dessous est généré à partir des
# commits ; pour un texte d'intro spécifique, utiliser les notes de la release
# GitHub.

release:
  # Rend une relance possible sur un tag déjà publié : sans ça, goreleaser
  # échoue sur « asset already_exists » et s'arrête avant l'étape Homebrew.
  replace_existing_artifacts: true

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # -trimpath n'est pas un ldflag : il s'adresse au compilateur, pas à
    # l'éditeur de liens. Il retire les chemins absolus de la machine de
    # compilation, si bien que deux machines produisent le même binaire à
    # partir du même tag. Une release devient vérifiable, ce qui a du sens
    # pour un outil de chiffrement dont l'utilisateur ne voit que le binaire.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# `brews` (formules) est déprécié depuis goreleaser v2.10 et sera supprimé en
# v2.16. Le remplaçant est `homebrew_casks`.
#
# Deux conséquences à connaître :
#   - un cask est spécifique à macOS, alors qu'une formule fonctionnait aussi
#     sous Linux. Le README ne documentait de toute façon Homebrew que pour
#     macOS, et install.sh couvre Linux ;
#   - les binaires ne sont pas signés, donc Gatekeeper les met en quarantaine.
#     L'étape post-install retire l'attribut, comme le faisait déjà install.sh.
homebrew_casks:
  - name: chiffremento
    binaries:
      - chiffremento

    repository:
      owner: ValMtp3
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

    directory: Casks
    homepage: "https://github.com/ValMtp3/chiffremento-go-cli"
    description: "Outil de chiffrement de fichiers en ligne de commande"
    license: "MIT"

    # Pourquoi `custom_block` plutôt que `hooks.post.install` : goreleaser écrit
    # toujours ce hook dans une stanza `postflight`, dépréciée par Homebrew 6.0.0
    # au profit de `postflight_steps`. Aucune option ne permet de changer ça, le
    # template du cask étant figé côté goreleaser ; `custom_block` est le seul
    # point d'injection de Ruby brut, et il écrit la stanza telle quelle.
    #
    # Deux détails qui ont l'air arbitraires mais ne le sont pas :
    #   - `postflight_steps` n'accepte pas du Ruby libre, seulement des étapes
    #     déclaratives. D'où `run` au lieu de `system_command`, et `on_macos`
    #     au lieu de `if OS.mac?` ;
    #   - le chemin du binaire est relatif, avec `chdir: "."`. Un `staged_path`
    #     s'écrirait ici `{{staged_path}}`, or goreleaser passe le cask entier
    #     dans son moteur de templates Go et échouerait sur un `staged_path`
    #     qu'il ne connaît pas. Le dossier de travail par défaut d'une étape de
    #     cask étant déjà `staged_path`, le chemin relatif dit la même chose.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "chiffremento"],
              chdir: "."
        end
      end
