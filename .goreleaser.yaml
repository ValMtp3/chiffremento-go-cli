version: 2

project_name: chiffremento

before:
  hooks:
    - go mod tidy

# Pas de `header` figé ici : celui de la v1.1.0 était réaffiché tel quel sur
# chaque nouvelle release. Le changelog ci-dessous est généré à partir des
# commits ; pour un texte d'intro spécifique, utiliser les notes de la release
# GitHub.

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# `brews` (formules) est déprécié depuis goreleaser v2.10 et sera supprimé en
# v2.16. Le remplaçant est `homebrew_casks`.
#
# Deux conséquences à connaître :
#   - un cask est spécifique à macOS, alors qu'une formule fonctionnait aussi
#     sous Linux. Le README ne documentait de toute façon Homebrew que pour
#     macOS, et install.sh couvre Linux ;
#   - les binaires ne sont pas signés, donc Gatekeeper les met en quarantaine.
#     Le hook post-install retire l'attribut, comme le faisait déjà install.sh.
homebrew_casks:
  - name: chiffremento
    binaries:
      - chiffremento

    repository:
      owner: ValMtp3
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

    directory: Casks
    homepage: "https://github.com/ValMtp3/chiffremento-go-cli"
    description: "Outil de chiffrement de fichiers en ligne de commande"
    license: "MIT"

    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/chiffremento"]
          end
