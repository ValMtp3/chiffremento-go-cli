version: 2

project_name: chiffremento

before:
  hooks:
    - go mod tidy

# Pas de `header` figé ici : celui de la v1.1.0 était réaffiché tel quel sur
# chaque nouvelle release. Le changelog ci-dessous est généré à partir des
# commits ; pour un texte d'intro spécifique, utiliser les notes de la release
# GitHub.

release:
  # Brouillon : la release n'est visible (et le cask Homebrew utilisable) que
  # si la vérification de la signature a réussi. Une release publiée d'emblée
  # ne pourrait plus être retirée sans que des utilisateurs l'aient déjà
  # téléchargée. L'étape qui la publie est dans .github/workflows/release.yml.
  draft: true
  # Rend une relance possible sur un tag déjà publié : sans ça, goreleaser
  # échoue sur « asset already_exists » et s'arrête avant l'étape Homebrew.
  replace_existing_artifacts: true
  # Relance après une vérification échouée : le brouillon d'avant est supprimé
  # et recréé. Sans ça, goreleaser cherche la release « par tag », ce que
  # GitHub ne fait jamais pour un brouillon : il en créerait un second, et on
  # ne saurait plus lequel est vérifié. Ne touche jamais une release publiée.
  replace_existing_draft: true
  # Le README invite à télécharger install.sh depuis la page de la release,
  # à côté de l'archive et de checksums.txt. Sans cette ligne, il n'y était
  # jamais joint.
  extra_files:
    - glob: ./install.sh

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # -trimpath n'est pas un ldflag : il s'adresse au compilateur, pas à
    # l'éditeur de liens. Il retire les chemins absolus de la machine de
    # compilation, si bien que deux machines produisent le même binaire à
    # partir du même tag. Une release devient vérifiable, ce qui a du sens
    # pour un outil de chiffrement dont l'utilisateur ne voit que le binaire.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  # install.sh est exécuté par les utilisateurs : son empreinte doit être dans
  # checksums.txt pour être couverte par la signature, comme les archives.
  extra_files:
    - glob: ./install.sh

# Un SBOM (inventaire des composants embarqués, format SPDX) par archive, généré
# par syft. Il permet à un utilisateur ou à un scanner de vulnérabilités de
# savoir quelles bibliothèques sont dans le binaire sans le décompiler. syft
# est installé dans le job CI seulement : il n'entre jamais dans go.mod.
sboms:
  - artifacts: archive

# Signature « sans clé » (Sigstore) du seul checksums.txt : il contient
# l'empreinte de chaque archive, donc une seule signature les couvre toutes.
# Pas de clé privée à garder ni à faire fuiter : la preuve d'identité est le
# jeton OIDC (`id-token: write`) du workflow GitHub, enregistré dans le
# journal public Sigstore. `--bundle` met signature et certificat dans un seul
# fichier (cosign v3). Au rejeu d'une release (`replace_existing_artifacts`),
# le bundle porte toujours le même nom : il est remplacé, pas dupliqué.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# `brews` (formules) est déprécié depuis goreleaser v2.10 et sera supprimé en
# v2.16. Le remplaçant est `homebrew_casks`.
#
# Deux conséquences à connaître :
#   - un cask est spécifique à macOS, alors qu'une formule fonctionnait aussi
#     sous Linux. Le README ne documentait de toute façon Homebrew que pour
#     macOS, et install.sh couvre Linux ;
#   - les binaires ne sont pas signés, donc Gatekeeper les met en quarantaine.
#     L'étape post-install retire l'attribut, comme le faisait déjà install.sh.
homebrew_casks:
  - name: chiffremento
    binaries:
      - chiffremento

    repository:
      owner: ValMtp3
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

    directory: Casks
    homepage: "https://github.com/ValMtp3/chiffremento-go-cli"
    description: "Outil de chiffrement de fichiers en ligne de commande"
    license: "MIT"

    # Pourquoi `custom_block` plutôt que `hooks.post.install` : goreleaser écrit
    # toujours ce hook dans une stanza `postflight`, dépréciée par Homebrew 6.0.0
    # au profit de `postflight_steps`. Aucune option ne permet de changer ça, le
    # template du cask étant figé côté goreleaser ; `custom_block` est le seul
    # point d'injection de Ruby brut, et il écrit la stanza telle quelle.
    #
    # Deux détails qui ont l'air arbitraires mais ne le sont pas :
    #   - `postflight_steps` n'accepte pas du Ruby libre, seulement des étapes
    #     déclaratives. D'où `run` au lieu de `system_command`, et `on_macos`
    #     au lieu de `if OS.mac?` ;
    #   - le chemin du binaire est relatif, avec `chdir: "."`. Un `staged_path`
    #     s'écrirait ici `{{staged_path}}`, or goreleaser passe le cask entier
    #     dans son moteur de templates Go et échouerait sur un `staged_path`
    #     qu'il ne connaît pas. Le dossier de travail par défaut d'une étape de
    #     cask étant déjà `staged_path`, le chemin relatif dit la même chose.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "chiffremento"],
              chdir: "."
        end
      end
